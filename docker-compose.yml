version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://weather-back.benjamin-lecomte.com/api
    depends_on:
      - backend
    ports:
      - "65184:80" # 3000 = port interne (Vite), 65184 = exposé

  backend:
    build:
      context: ./backend
    ports:
      - "65185:3001"
    env_file:
      - ./backend/.env
    mem_limit: 1024m
