version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://weather-dashboard-back.benjamin-lecomte.com/api
    depends_on:
      - backend
    ports:
      - "80:3000" # 3000 = port interne du conteneur (Vite/React), 80 = exposé à l'extérieur

  backend:
    build:
      context: ./backend
    ports:
      - "8080:3001" # 3001 = port interne du backend, 8080 = exposé à l'extérieur
    env_file:
      - ./backend/.env
